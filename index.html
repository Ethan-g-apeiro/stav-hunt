<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Metoki Solutions</title>

  <style>
    html, body, iframe {
      margin: 0;
      width: 100%;
      height: 100%;
      border: 0;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 22px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    #loading.show {
      opacity: 1;
    }
  </style>
</head>

<body>

<iframe src="https://metoki-solutions.com"></iframe>

<div id="loading">
  Oops, wrong site. Redirecting...
</div>

<script>
  setTimeout(() => {
    document.getElementById("loading").classList.add("show");

    setTimeout(() => {
      window.location.replace(
        "https://gchq.github.io/CyberChef/#recipe=From_Hex('Auto')XOR({'option':'UTF8','string':''},'Standard',false)&ieol=CRLF"
      );
    }, 1000);

  }, 2500);
</script>

</body>
</html>
