<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>...</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Consolas, Monaco, "Courier New", monospace;
    }

    /* =========================
       WRONG WEBSITE
       ========================= */

    #site {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        border: 0;

        z-index: 1;

        background: white;
    }


    /* =========================
       DARKEN WEBSITE WHILE TALKING
       ========================= */

    #shade {
        position: fixed;
        inset: 0;

        background: rgba(0, 0, 0, 0.38);

        z-index: 5;

        pointer-events: none;

        transition: opacity 0.4s ease;
    }


    /* =========================
       DIALOGUE
       ========================= */

    #dialogueWrapper {
        position: fixed;

        left: 50%;
        bottom: 5vh;

        transform: translateX(-50%);

        width: min(950px, 92vw);

        z-index: 20;

        transition:
            opacity 0.25s ease,
            transform 0.25s ease;
    }

    #dialogueWrapper.hidden {
        opacity: 0;
        transform: translate(-50%, 25px);
        pointer-events: none;
    }


    #speaker {
        display: inline-block;

        margin-left: 22px;

        padding: 9px 18px;

        background: #111;
        color: white;

        border:
            3px solid white;

        border-bottom: 0;

        border-radius: 12px 12px 0 0;

        font-size: clamp(15px, 2vw, 21px);
        font-weight: bold;

        letter-spacing: 1px;
    }


    #dialogue {
        position: relative;

        min-height: 180px;

        padding:
            30px
            34px
            55px;

        background:
            rgba(10, 10, 10, 0.96);

        color: white;

        border:
            4px solid white;

        border-radius:
            18px;

        box-shadow:
            0 12px 45px rgba(0,0,0,0.7);

        cursor: pointer;

        user-select: none;
    }


    #text {
        font-size:
            clamp(25px, 4vw, 44px);

        line-height: 1.25;

        white-space:
            pre-wrap;
    }


    #continue {
        position: absolute;

        right: 23px;
        bottom: 14px;

        font-size:
            clamp(13px, 1.5vw, 17px);

        opacity: 0.55;

        animation:
            blink 1s infinite;
    }


    @keyframes blink {

        0%,
        100% {
            opacity: 0.35;
        }

        50% {
            opacity: 0.8;
        }
    }


    /* =========================
       PLAYER CHOICES
       ========================= */

    #choices {
        position: fixed;

        inset: 0;

        z-index: 50;

        display: none;

        align-items: center;
        justify-content: center;

        padding: 20px;

        background:
            rgba(0, 0, 0, 0.48);
    }


    #choices.show {
        display: flex;
    }


    #choiceBox {
        width:
            min(720px, 92vw);

        display: flex;
        flex-direction: column;

        gap: 20px;
    }


    .choice {
        width: 100%;

        padding:
            23px
            30px;

        background:
            #111;

        color:
            white;

        border:
            4px solid white;

        border-radius:
            10px;

        font-family:
            Consolas,
            Monaco,
            "Courier New",
            monospace;

        font-size:
            clamp(21px, 3vw, 30px);

        font-weight:
            bold;

        text-align:
            left;

        cursor:
            pointer;

        box-shadow:
            0 8px 0 white,
            0 14px 30px rgba(0,0,0,0.5);

        transform:
            translateY(0);

        transition:
            transform 0.07s ease,
            box-shadow 0.07s ease,
            background 0.08s ease;
    }


    .choice:hover {
        background:
            #242424;
    }


    .choice:active {
        transform:
            translateY(8px);

        box-shadow:
            0 0 0 white,
            0 5px 12px rgba(0,0,0,0.5);
    }


    /* =========================
       FADE TO CYBERCHEF
       ========================= */

    #fade {
        position: fixed;

        inset: 0;

        z-index: 100;

        background:
            black;

        opacity:
            0;

        pointer-events:
            none;

        transition:
            opacity 1.1s ease;
    }


    #fade.active {
        opacity:
            1;
    }


    /* =========================
       LITTLE CENTER MESSAGE
       ========================= */

    #centerMessage {
        position: fixed;

        inset: 0;

        z-index: 80;

        display: none;

        align-items: center;
        justify-content: center;

        color: white;

        font-size:
            clamp(28px, 6vw, 65px);

        font-weight: bold;

        text-align: center;

        padding: 30px;

        background:
            rgba(0,0,0,0.9);
    }


    #centerMessage.show {
        display: flex;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

        #dialogueWrapper {
            width: 94vw;
            bottom: 3vh;
        }

        #dialogue {
            min-height: 190px;

            padding:
                25px
                22px
                50px;
        }

        #speaker {
            margin-left: 12px;
        }
    }
</style>

<body>

<!-- OPTIONAL BIG MESSAGE -->

<div id="centerMessage"></div>


<!-- FINAL FADE -->

<script>

/* ==========================================================
   ELEMENTS
   ========================================================== */

const wrapper =
    document.getElementById("dialogueWrapper");

const dialogue =
    document.getElementById("dialogue");

const speaker =
    document.getElementById("speaker");

const text =
    document.getElementById("text");

const continueText =
    document.getElementById("continue");

const choices =
    document.getElementById("choices");

const choiceBox =
    document.getElementById("choiceBox");

const shade =
    document.getElementById("shade");

const fade =
    document.getElementById("fade");

const centerMessage =
    document.getElementById("centerMessage");


/* ==========================================================
   CYBERCHEF DESTINATION
   ========================================================== */

const cyberChef =
    "https://gchq.github.io/CyberChef/#recipe=From_Hex('Auto')XOR({'option':'UTF8','string':''},'Standard',false)&ieol=CRLF";


/* ==========================================================
   BASIC HELPERS
   ========================================================== */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}


/* ==========================================================
   AUDIO
   ========================================================== */

let audioContext = null;


function enableAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


/*
   Browsers won't let us make sound until
   the user interacts with the page once.
*/

document.addEventListener(
    "click",
    enableAudio
);

document.addEventListener(
    "touchstart",
    enableAudio
);



/* ==========================================================
   EXTRACTOR TALK SOUND
   ========================================================== */

function speechBeep(character) {

    if (
        !audioContext ||
        audioContext.state !== "running"
    ) {
        return;
    }


    if (
        character === " " ||
        character === "." ||
        character === "," ||
        character === "?" ||
        character === "!"
    ) {
        return;
    }


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    /*
       Tiny pitch variation gives it
       a fake "voice".
    */

    const pitch =
        175 +
        Math.random() * 35;


    oscillator.type =
        "square";

    oscillator.frequency.value =
        pitch;


    gain.gain.setValueAtTime(
        0.022,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.035
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime + 0.04
    );

}



/* ==========================================================
   CHOICE CLICK SOUND
   ========================================================== */

function choiceSound() {

    if (
        !audioContext ||
        audioContext.state !== "running"
    ) {
        return;
    }


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        "square";


    oscillator.frequency.setValueAtTime(
        150,
        audioContext.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        75,
        audioContext.currentTime + 0.11
    );


    gain.gain.setValueAtTime(
        0.07,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.12
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime + 0.13
    );

}



/* ==========================================================
   TYPEWRITER
   ========================================================== */

async function typeText(message) {

    text.textContent = "";


    for (
        let i = 0;
        i < message.length;
        i++
    ) {

        const char =
            message[i];


        text.textContent +=
            char;


        /*
           Every second character.
           Otherwise it gets VERY annoying.
        */

        if (
            i % 2 === 0
        ) {

            speechBeep(char);

        }


        let delay =
            29;


        if (
            char === "."
        ) {
            delay = 150;
        }


        if (
            char === ","
        ) {
            delay = 75;
        }


        if (
            char === "?"
        ) {
            delay = 170;
        }


        if (
            char === "!"
        ) {
            delay = 140;
        }


        await sleep(delay);

    }

}



/* ==========================================================
   WAIT FOR USER CLICK
   ========================================================== */

function waitForClick() {

    return new Promise(
        resolve => {

            const handler =
                () => {

                    dialogue.removeEventListener(
                        "click",
                        handler
                    );

                    resolve();

                };


            dialogue.addEventListener(
                "click",
                handler
            );

        }
    );

}



/* ==========================================================
   SAY
   ========================================================== */

async function say(
    message,
    name = "EXTRACTOR"
) {

    speaker.textContent =
        name;


    wrapper.classList.remove(
        "hidden"
    );


    continueText.style.display =
        "none";


    await typeText(
        message
    );


    continueText.style.display =
        "block";


    await waitForClick();

}



/* ==========================================================
   PLAYER CHOICE
   ========================================================== */

async function playerChoice(
    options
) {

    wrapper.classList.add(
        "hidden"
    );


    await sleep(180);


    choiceBox.innerHTML =
        "";


    return new Promise(
        resolve => {

            options.forEach(
                option => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "choice";


                    button.textContent =
                        "> " +
                        option.text;


                    button.onclick =
                        async () => {

                            enableAudio();

                            choiceSound();

                            /*
                               Let the button visibly depress.
                            */

                            await sleep(90);


                            choices.classList.remove(
                                "show"
                            );


                            resolve(
                                option.value
                            );

                        };


                    choiceBox.appendChild(
                        button
                    );

                }
            );


            choices.classList.add(
                "show"
            );

        }
    );

}



/* ==========================================================
   BIG CENTER TEXT
   ========================================================== */

async function bigMessage(
    message,
    duration = 1600
) {

    centerMessage.textContent =
        message;


    centerMessage.classList.add(
        "show"
    );


    await sleep(
        duration
    );


    centerMessage.classList.remove(
        "show"
    );

}
